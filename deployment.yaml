apiVersion: apps/v1
kind: Deployment
metadata:
  name: turnos-deployment
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: turnos
  template:
    metadata:
      labels:
        app: turnos
    spec:
      containers:
      - name: microservicio-turnos
        image: TU_CUENTA_AWS.dkr.ecr.us-east-1.amazonaws.com/mi-clinica-turnos:latest
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: turnos-service
spec:
  type: LoadBalancer 
  ports:
  - port: 80
    targetPort: 3001
  selector:
    app: turnos 