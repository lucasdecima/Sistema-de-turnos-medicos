<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Turnos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏥 DRa. Barrionuevo Paula  - Panel de Turnos</h1>
        
        <section class="form-section">
            <h2>Agendar Nuevo Turno</h2>
            <form id="form-turno">
                <div class="form-group">
                    <label for="paciente">Nombre del Paciente:</label>
                    <input type="text" id="paciente" required placeholder="Ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="hora">Hora:</label>
                    <input type="time" id="hora" required>
                </div>
                <button type="submit">Reservar Turno</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Turnos Programados</h2>
            
            <div style="text-align: center; margin-bottom: 20px;">
                <button onclick="cargarTurnos()" style="background-color: #28a745; width: auto; padding: 10px 20px;">🔄 Actualizar Lista de Turnos</button>
            </div>

            <div id="lista-turnos" class="turnos-grid">
                </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
