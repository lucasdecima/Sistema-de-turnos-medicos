# Service del gateway. Por ahora solo es accesible desde adentro del clúster;
# para probar desde tu PC usamos "kubectl port-forward". Cómo exponerlo a internet
# (con HTTPS) se define cuando lleguemos a la nube.
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000