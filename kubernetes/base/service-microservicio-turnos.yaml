# Service del microservicio: una dirección estable (el nombre "turnos") que reparte
# los pedidos entre los pods sanos. Solo es accesible desde adentro del clúster.
apiVersion: v1
kind: Service
metadata:
  name: turnos
spec:
  selector:
    app: turnos
  ports:
    - port: 3001
      targetPort: 3001