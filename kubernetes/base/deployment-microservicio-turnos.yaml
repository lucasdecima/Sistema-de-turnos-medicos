# Deployment del microservicio: "quiero 2 copias (pods) funcionando siempre".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: turnos
  labels:
    app: turnos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: turnos
  template:
    metadata:
      labels:
        app: turnos
    spec:
      # Corre como usuario sin privilegios (el usuario "node" de la imagen es el 1000)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: turnos
          image: turnos-microservicio:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          # Variables no secretas: todas las del ConfigMap
          envFrom:
            - configMapRef:
                name: turnos-config
          # La contraseña viene del Secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: turnos-db
                  key: DB_PASSWORD
          # Readiness: ¿está listo para recibir tráfico? Si no, el Service no le manda pedidos.
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: ¿sigue vivo? Si falla varias veces, Kubernetes lo reinicia.
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 250m
              memory: 384Mi